<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrossartigeZeitPlanung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #020617; 
        color: #e2e8f0;
        overflow-x: hidden;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Mesh Gradient Animation */
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                    radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                    radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        filter: blur(100px);
        opacity: 0.5;
        animation: pulseGradient 15s ease infinite alternate;
      }

      @keyframes pulseGradient {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.1); opacity: 0.6; }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }

      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .glass-card {
        background: rgba(30, 41, 59, 0.4);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      /* --- CYBERPUNK GLITCH EFFECT --- */
      .cyber-glitch-container {
        position: relative;
        overflow: hidden;
      }

      /* Scanline Overlay (Always visible but subtle on glitch cards) */
      .cyber-scanlines::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        opacity: 0.4;
      }

      /* The Glitch Animation Class */
      .cyber-twitch {
        animation: glitch-anim 6s infinite; /* Base timing, overwritten by inline style for randomness */
      }

      @keyframes glitch-anim {
        0% { transform: translate(0); }
        92% { transform: translate(0); filter: none; opacity: 1; }
        92.5% { transform: translate(-2px, 1px); filter: drop-shadow(2px 0 rgba(255,0,0,0.5)) drop-shadow(-2px 0 rgba(0,255,255,0.5)); opacity: 0.9; }
        93% { transform: translate(2px, -1px); filter: drop-shadow(-2px 0 rgba(255,0,0,0.5)) drop-shadow(2px 0 rgba(0,255,255,0.5)); opacity: 0.8; }
        93.5% { transform: translate(0); filter: none; opacity: 1; }
        96% { transform: skew(1deg); }
        96.5% { transform: skew(0deg); }
        100% { transform: translate(0); }
      }

      /* Optional: A subtle border glow pulse for off-site */
      @keyframes signal-pulse {
        0%, 100% { box-shadow: inset 0 0 10px rgba(6, 182, 212, 0.05); }
        50% { box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.15); }
      }
      
      .signal-active {
        animation: signal-pulse 4s ease-in-out infinite;
      }
    </style>
