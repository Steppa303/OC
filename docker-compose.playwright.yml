version: '3.8'
services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    network_mode: host
    command: >
      bash -c "
        npm install &&
        npx playwright install chromium firefox webkit &&
        npx playwright test --reporter=html,junit
      "
    shm_size: '2gb'