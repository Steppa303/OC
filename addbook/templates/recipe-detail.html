<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>__TITLE__ – AddBook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      line-height: 1.7;
      background: #fff;
      color: #222;
      -webkit-text-size-adjust: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    .back-link {
      font-size: 13px;
      color: #555;
      text-decoration: none;
      margin-bottom: 20px;
      display: inline-block;
    }
    .back-link:hover { text-decoration: underline; }

    .recipe-header {
      border-bottom: 2px solid #222;
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .recipe-header .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #666;
    }
    .recipe-header h1 {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
      line-height: 1.3;
    }

    .recipe-image {
      width: 100%;
      max-height: 320px;
      background: #eee;
      border: 1px solid #ccc;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .recipe-image img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }
    .recipe-image .no-img {
      font-size: 48px;
      color: #aaa;
      padding: 40px 0;
    }

    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding: 14px 18px;
      background: #f7f7f7;
      border: 1px solid #ddd;
    }
    .meta-item {
      flex: 1;
      min-width: 100px;
    }
    .meta-item .meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
    }
    .meta-item .meta-value {
      font-size: 15px;
      font-weight: bold;
      color: #222;
    }

    .section {
      margin-bottom: 28px;
    }
    .section h2 {
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .ingredient-list {
      list-style: none;
    }
    .ingredient-list li {
      padding: 5px 0;
      border-bottom: 1px dotted #eee;
      font-size: 15px;
    }

    .instruction-list {
      list-style: none;
      counter-reset: step;
    }
    .instruction-list li {
      counter-increment: step;
      padding: 10px 0 10px 40px;
      position: relative;
      border-bottom: 1px dotted #eee;
      line-height: 1.65;
    }
    .instruction-list li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 8px;
      width: 28px;
      height: 28px;
      background: #222;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      line-height: 28px;
      border-radius: 2px;
    }

    .rating-box {
      display: inline-block;
      padding: 6px 14px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .rating-box .stars { font-size: 17px; }

    .source-link {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }
    .source-link a {
      color: #222;
    }

    .footer {
      margin-top: 40px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  __BACK_LINK__
  <div class="recipe-header">
    <div class="label">AddBook · Rezept</div>
    <h1>__TITLE__</h1>
  </div>

  <div class="recipe-image">
    __IMAGE__
  </div>

  <div class="meta-grid">
    __META_ITEMS__
  </div>

  __RATING__

  <div class="section">
    <h2>🍅 Zutaten</h2>
    <ul class="ingredient-list">
      __INGREDIENTS__
    </ul>
  </div>

  <div class="section">
    <h2>📝 Zubereitung</h2>
    <ol class="instruction-list">
      __INSTRUCTIONS__
    </ol>
  </div>

  __SOURCE__

  <div class="footer">
    addbook.steppa.online
  </div>
</body>
</html>
