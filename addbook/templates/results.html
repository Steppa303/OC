<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AddBook — Ergebnisse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fff;
      color: #111;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    /* Header */
    .header { border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 20px; }
    .header h1 { font-size: 22px; font-weight: bold; }
    .header .subtitle { font-size: 14px; color: #555; margin-top: 4px; }

    /* Results list — single column for e-ink */
    .results { list-style: none; }
    .result {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #ccc;
      align-items: flex-start;
    }
    .result:last-child { border-bottom: none; }

    /* Cover — small for e-ink speed */
    .cover-wrap {
      flex-shrink: 0;
      width: 160px;
      height: 220px;
      background: #eee;
      border: 1px solid #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cover-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .cover-placeholder {
      font-size: 28px;
      color: #999;
    }

    /* Info */
    .info { flex: 1; min-width: 0; }
    .title { font-size: 17px; font-weight: bold; margin-bottom: 2px; }
    .author { font-size: 14px; color: #444; margin-bottom: 4px; }
    .meta { font-size: 12px; color: #777; margin-bottom: 10px; }

    /* Info panel */
    .info-btn {
      display: inline-block;
      padding: 8px 16px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #111;
      border: 2px solid #111;
      cursor: pointer;
      margin-right: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .info-btn:active { background: #eee; }
    .details {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }
    .details.open { display: block; }
    .details h3 { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .details p { margin-bottom: 8px; }
    .details .source { font-size: 11px; color: #999; margin-top: 8px; }

    /* Big button for e-ink touch */
    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      background: #111;
      color: #fff;
      border: 2px solid #111;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: #444; }
    .btn:disabled { background: #ccc; border-color: #ccc; color: #666; cursor: default; }

    /* Status */
    .status {
      margin-top: 6px;
      font-size: 13px;
      min-height: 18px;
    }
    .status-ok { color: #111; font-weight: bold; }
    .status-err { color: #555; }
    .status-wait { color: #777; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 18px; color: #555; }

    /* Footer */
    .footer {
      margin-top: 30px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    /* Link styling */
    a { color: #111; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="queryDisplay"></h1>
      <div class="subtitle" id="resultInfo"></div>
    </div>

    <ul class="results" id="results"></ul>

    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">📚</div>
      <div class="empty-text">Keine Ergebnisse gefunden</div>
    </div>

    <div class="footer">addbook.steppa.online</div>
  </div>

  <script>
    const __BOOKS__ = [];
    const __RESULT_ID__ = "";
    const __QUERY__ = "";
    const __TIMESTAMP__ = "";

    const statusText = {
      queued: '⏳ Warteschlange…',
      downloading: '📥 Wird heruntergeladen…',
      sending: '📧 Wird an Kindle gesendet…',
      done: '✅ Erfolgreich an Kindle gesendet!',
      failed: '❌ Fehlgeschlagen'
    };

    function render() {
      document.getElementById('queryDisplay').textContent = __QUERY__;
      document.getElementById('resultInfo').textContent = __BOOKS__.length + ' Bücher gefunden';

      if (__BOOKS__.length === 0) {
        document.getElementById('emptyState').style.display = '';
        return;
      }

      const ul = document.getElementById('results');
      ul.innerHTML = '';

      __BOOKS__.forEach((book, i) => {
        const li = document.createElement('li');
        li.className = 'result';

        const cover = book.coverUrl
          ? '<img src="' + esc(book.coverUrl) + '" alt="" loading="lazy">'
          : '<span class="cover-placeholder">📖</span>';

        const meta = [book.year, book.language, book.format, book.size].filter(Boolean).join(' · ');

        var btns =
            '<button class="btn" id="btn-' + i + '" onclick="dl(' + i + ')">📥 Zu Kindle senden</button>' +
            '<button class="info-btn" onclick="toggleInfo(' + i + ')">ℹ️ Mehr Infos</button>';

        li.innerHTML =
          '<div class="cover-wrap">' + cover + '</div>' +
          '<div class="info">' +
            '<div class="title">' + esc(book.title || 'Unbekannt') + '</div>' +
            '<div class="author">' + esc(book.author || 'Unbekannter Autor') + '</div>' +
            (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
            btns +
            '<div class="status" id="st-' + i + '"></div>' +
            '<div class="details" id="det-' + i + '">' +
              '<p id="det-text-' + i + '"><em>Wird geladen…</em></p>' +
              '<div class="source" id="det-src-' + i + '"></div>' +
            '</div>' +
          '</div>';

        ul.appendChild(li);
      });
    }

    function dl(i) {
      var book = __BOOKS__[i];
      var btn = document.getElementById('btn-' + i);
      var st = document.getElementById('st-' + i);

      btn.disabled = true;
      btn.textContent = '⏳ Bitte warten…';
      st.textContent = '';
      st.className = 'status';

      fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          resultId: __RESULT_ID__,
          index: i,
          md5: book.md5,
          title: book.title,
          author: book.author || ''
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) { fail(i, data.error); return; }
        poll(data.id, i);
      })
      .catch(function(e) { fail(i, 'Netzwerkfehler: ' + e.message); });
    }

    function poll(id, i) {
      var btn = document.getElementById('btn-' + i);
      var st = document.getElementById('st-' + i);

      function check() {
        fetch('/api/status/' + id)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            st.textContent = statusText[data.status] || '⏳…';
            st.className = 'status status-wait';

            if (data.status === 'done') {
              btn.textContent = '✅ Gesendet';
              st.className = 'status status-ok';
              return;
            }
            if (data.status === 'failed') {
              fail(i, data.error || 'Unbekannter Fehler');
              return;
            }
            setTimeout(check, 2000);
          })
          .catch(function() { setTimeout(check, 3000); });
      }
      check();
    }

    function fail(i, msg) {
      var btn = document.getElementById('btn-' + i);
      var st = document.getElementById('st-' + i);
      btn.disabled = false;
      btn.textContent = '📥 Erneut versuchen';
      st.textContent = '❌ ' + msg;
      st.className = 'status status-err';
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function toggleInfo(i) {
      var det = document.getElementById('det-' + i);
      det.classList.toggle('open');
      // Fetch from Open Library if not already loaded
      var book = __BOOKS__[i];
      var textEl = document.getElementById('det-text-' + i);
      var srcEl = document.getElementById('det-src-' + i);
      if (textEl.dataset.loaded) return;
      fetchOpenLibrary(book, i);
    }

    function fetchOpenLibrary(book, i) {
      var textEl = document.getElementById('det-text-' + i);
      var srcEl = document.getElementById('det-src-' + i);
      // Clean title: remove series numbers, subtitles in parens, special chars
      var raw = (book.title || '');
      var query = raw
        .replace(/\s*[-–•]\s*.*/g, '')  // remove everything after dash/separator
        .replace(/\s*\(.*\)/g, '')       // remove parenthesized text
        .replace(/\s*\[.*\]/g, '')       // remove bracketed text
        .replace(/[^a-zA-Z0-9äöüÄÖÜß\s]/g, '')
        .trim();
      if (query.length < 2) query = raw.replace(/[^a-zA-Z0-9\s]/g, '').trim();
      if (query.length < 2) { textEl.innerHTML = '<em>Kein Titel vorhanden.</em>'; return; }

      fetch('/api/bookinfo?title=' + encodeURIComponent(query))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          textEl.dataset.loaded = '1';
          if (!data.docs || !data.docs.length) {
            textEl.innerHTML = '<em>Keine Informationen gefunden.</em>';
            return;
          }
          var doc = data.docs[0];
          var parts = [];
          // Description (klappentext)
          var desc = doc.description;
          if (typeof desc === 'string' && desc.length > 30) {
            parts.push('<strong>Klappentext:</strong><br>' + esc(desc));
          } else if (Array.isArray(desc) && desc.length && desc[0].length > 30) {
            parts.push('<strong>Klappentext:</strong><br>' + esc(desc[0]));
          }
          if (doc.author_name) parts.push('<strong>Autor:</strong> ' + esc(doc.author_name.join(', ')));
          if (doc.first_publish_year) parts.push('<strong>Ersterscheinung:</strong> ' + doc.first_publish_year);
          if (doc.subject && doc.subject.length) {
            var tags = doc.subject.slice(0, 8).map(function(s) { return esc(s); }).join(', ');
            parts.push('<strong>Themen:</strong> ' + tags);
          }
          if (parts.length) {
            textEl.innerHTML = parts.join('<br><br>');
          } else {
            textEl.innerHTML = '<em>Keine Detailinformationen verfügbar.</em>';
          }
          srcEl.textContent = 'Quelle: Open Library';
        })
        .catch(function() {
          textEl.dataset.loaded = '1';
          textEl.innerHTML = '<em>Infos konnten nicht geladen werden.</em>';
        });
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
