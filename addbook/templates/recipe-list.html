<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>__QUERY__ – Rezepte – AddBook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      line-height: 1.6;
      background: #fff;
      color: #222;
      -webkit-text-size-adjust: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    .header {
      border-bottom: 2px solid #222;
      padding-bottom: 12px;
      margin-bottom: 28px;
    }
    .header .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #666;
    }
    .header h1 {
      font-size: 22px;
      font-weight: bold;
      margin-top: 4px;
    }
    .header .count {
      font-size: 14px;
      color: #555;
      margin-top: 4px;
    }

    .recipe-cards { list-style: none; }
    .recipe-card {
      display: flex;
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid #ddd;
      align-items: flex-start;
      text-decoration: none;
      color: inherit;
    }
    .recipe-card:hover { background: #fafafa; }
    .recipe-card:last-child { border-bottom: none; }

    .card-image {
      flex-shrink: 0;
      width: 120px;
      height: 90px;
      background: #eee;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-image .no-img {
      font-size: 32px;
      color: #aaa;
    }

    .card-info { flex: 1; min-width: 0; }
    .card-info .recipe-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .card-info .recipe-meta {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }
    .card-info .recipe-rating {
      font-size: 14px;
      color: #222;
    }
    .card-info .recipe-rating .stars { font-size: 16px; }
    .card-info .recipe-source {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .footer {
      margin-top: 36px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="label">AddBook · Rezepte</div>
    <h1>__QUERY__</h1>
    <div class="count">__COUNT__ Rezepte gefunden</div>
  </div>

  <ul class="recipe-cards">
    __RECIPE_CARDS__
  </ul>

  <div class="footer">
    addbook.steppa.online
  </div>
</body>
</html>
